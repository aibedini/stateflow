name: QA

on:
  push:
    branches: [main]
  pull_request:

# Every job below fails hard on any failure — no "|| true", no silent skips.
# CI setup steps fail the job if the environment cannot be created.

jobs:
  # ------------------------------------------------------------------
  # Static analysis + unit suites (per-PHP-version matrix).
  # Includes the declared PHP minimum (Requires PHP: 8.0) so the
  # minimum claim is CI-verified, not aspirational (SF-001.2 item 6).
  # ------------------------------------------------------------------
  unit:
    name: Static analysis + unit suites (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rows: declared minimum (8.0), middle (8.2), current (8.3).
        # PHPStan 2.x / WPCS 3 / PHPUnit 9 all run on PHP 8.0.
        php: ['8.0', '8.2', '8.3']
        include:
          # SF-001.2 item 7 — explicit minimum stack for the minimum row:
          # the WooCommerce-present unit fixture is pinned to the minimum
          # supported WooCommerce generation (8.0.0) instead of the mid one.
          - php: '8.0'
            stateflow_wc_fixture: 8.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax lint
        run: composer lint

      - name: PHPCS (WordPress Coding Standards)
        run: composer cs

      - name: PHPStan (level max)
        run: composer stan

      - name: Unit suite (WooCommerce absent)
        run: composer test:unit

      # WC_TEST_VERSION drives which WooCommerce generation the
      # present-process suite simulates (see tests/bootstrap-present.php).
      - name: Unit suite (WooCommerce present)
        run: composer test:present
        env:
          WC_TEST_VERSION: ${{ matrix.stateflow_wc_fixture || '9.2.0' }}

  # ------------------------------------------------------------------
  # Real WordPress + real WooCommerce integration (matrix rows below).
  # Uses the vendored, SHA-pinned WP-CLI test installer
  # (bin/install-wp-tests.sh) and the released WooCommerce plugin zip
  # — the same package layout merchants install (SF-001.2 item 3).
  # ------------------------------------------------------------------
  integration:
    name: Integration (PHP ${{ matrix.php }} / WP ${{ matrix.wp }} / WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SF-001.2 item 7 — declared minimum: PHP 8.0 + WP 6.4 + WC 8.0.0.
          - { php: '8.0', wp: '6.4',    wc: '8.0.0' }
          # Middle generation (justified: the default present-suite fixture
          # and the previous smoke-tested generation).
          - { php: '8.2', wp: '6.5',    wc: '9.2.0' }
          # Current verified generation (matches the SQLite smoke test and
          # the local .smoke stack: WP latest + WC 11.0.1).
          - { php: '8.3', wp: 'latest', wc: '11.0.1' }
    env:
      STATEFLOW_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The installer needs a live MySQL connection to create the test DB.
      - name: Start MySQL
        run: sudo systemctl start mysql.service

      # bin/install-wp-tests.sh fetches the WordPress test suite over SVN
      # (develop.svn.wordpress.org); runners no longer ship subversion.
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      # Vendored from wp-cli/sample-plugin — full provenance (upstream
      # commit, retrieval date, SHA256) is recorded in the file header of
      # bin/install-wp-tests.sh. WordPress core no longer ships it.
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh stateflow root root 127.0.0.1 ${{ matrix.wp }}

      # Released plugin zip (item 3): exact package merchants install —
      # NOT the woocommerce/woocommerce monorepo checkout, whose src/
      # layout (and root woocommerce.php) is not the installable layout.
      # WooCommerce resolves HPOS declarations via plugin_basename(),
      # which only matches plugins inside wp-content/plugins — so the
      # released package is installed there, and StateFlow is copied in
      # beside it (same layout merchants get after installing both).
      - name: Download WooCommerce ${{ matrix.wc }} release
        run: |
          curl -fsSL "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.wc }}.zip" -o /tmp/wc.zip
          unzip -q /tmp/wc.zip -d /tmp/wc-plugin
          WP_SRC_DIR="/tmp/wordpress"
          mkdir -p "$WP_SRC_DIR/wp-content/plugins"
          unzip -q /tmp/wc.zip -d "$WP_SRC_DIR/wp-content/plugins/"
          cp -r "$GITHUB_WORKSPACE" "$WP_SRC_DIR/wp-content/plugins/stateflow"
          rm -rf "$WP_SRC_DIR/wp-content/plugins/stateflow/.git" "$WP_SRC_DIR/wp-content/plugins/stateflow/vendor"
          # Mirrors a released package (no dev vendor/): the installed copy
          # uses the plugin's PSR-4 fallback autoloader, while the phpunit
          # process uses the workspace composer autoloader — two different
          # ComposerAutoloaderInit class names, no redeclare collision.
          echo "STATEFLOW_WC_PLUGIN_FILE=$WP_SRC_DIR/wp-content/plugins/woocommerce/woocommerce.php" >> "$GITHUB_ENV"
          echo "STATEFLOW_BOOTSTRAP_FILE=$WP_SRC_DIR/wp-content/plugins/stateflow/stateflow.php" >> "$GITHUB_ENV"

      # bin/qa.php test:integration enforces the strict mode (missing
      # WP test env => exit 1) via STATEFLOW_STRICT_INTEGRATION=1.
      - name: Run integration suite (mandatory)
        run: composer test:integration

  # ------------------------------------------------------------------
  # Real MariaDB 10.11 validation (SF-002 §25): the same SF-002 schema/
  # migration integration set against MariaDB — the engine family most
  # common on real WordPress hosts — on the current stack.
  # ------------------------------------------------------------------
  mariadb:
    name: Integration (MariaDB 10.11 / PHP 8.3 / WP latest / WC 11.0.1)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: stateflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --password=root || mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      STATEFLOW_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # bin/install-wp-tests.sh fetches the WordPress test suite over SVN;
      # runners no longer ship subversion.
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      # The MariaDB service container already created the database
      # (MARIADB_DATABASE below), so the installer must skip its own
      # CREATE DATABASE step (6th argument = skip-database-creation).
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh stateflow root root 127.0.0.1 latest true

      - name: Download WooCommerce 11.0.1 release
        run: |
          curl -fsSL "https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip" -o /tmp/wc.zip
          unzip -q /tmp/wc.zip -d /tmp/wc-plugin
          WP_SRC_DIR="/tmp/wordpress"
          mkdir -p "$WP_SRC_DIR/wp-content/plugins"
          unzip -q /tmp/wc.zip -d "$WP_SRC_DIR/wp-content/plugins/"
          cp -r "$GITHUB_WORKSPACE" "$WP_SRC_DIR/wp-content/plugins/stateflow"
          rm -rf "$WP_SRC_DIR/wp-content/plugins/stateflow/.git" "$WP_SRC_DIR/wp-content/plugins/stateflow/vendor"
          echo "STATEFLOW_WC_PLUGIN_FILE=$WP_SRC_DIR/wp-content/plugins/woocommerce/woocommerce.php" >> "$GITHUB_ENV"
          echo "STATEFLOW_BOOTSTRAP_FILE=$WP_SRC_DIR/wp-content/plugins/stateflow/stateflow.php" >> "$GITHUB_ENV"

      - name: Run SF-002 schema/migration integration suite (mandatory)
        run: composer test:integration

  # ------------------------------------------------------------------
  # End-to-end smoke: real WP + real WooCommerce + SQLite, activate the
  # plugin (twice), verify HPOS listing through the container.
  # ------------------------------------------------------------------
  smoke:
    name: Plugin smoke (WP latest + WC latest, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Assemble plugin directory
        run: mkdir -p /tmp/stateflow-plugin && cp stateflow.php composer.json /tmp/stateflow-plugin/ && cp -r src vendor /tmp/stateflow-plugin/

      - name: Install WordPress with SQLite and activate WooCommerce + StateFlow
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          wp core download --allow-root
          wp config create --dbname=smoke --dbuser=unused --dbpass=unused --dbhost=127.0.0.1 --path=/tmp/smoke --allow-root --skip-check
          wp config set DB_ENGINE sqlite --path=/tmp/smoke --allow-root
          wp config set DB_NAME "/tmp/smoke/wp-content/database/.ht.sqlite" --path=/tmp/smoke --allow-root
          curl -fsSL https://downloads.wordpress.org/plugin/sqlite-database-integration.latest-stable.zip -o sqlite.zip
          curl -fsSL https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o wc.zip
          unzip -q sqlite.zip -d wp-content/plugins/ && unzip -q wc.zip -d wp-content/plugins/
          rm sqlite.zip wc.zip
          cp wp-content/plugins/sqlite-database-integration/db.copy wp-content/db.php
          mkdir -p wp-content/database wp-content/uploads wp-content/upgrade
          cp -r /tmp/stateflow-plugin wp-content/plugins/stateflow
          wp core install --url=smoke.local --title="Smoke" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email --allow-root
          wp plugin activate woocommerce stateflow --allow-root
          wp plugin activate woocommerce stateflow --allow-root  # repeat: must stay Success
          wp plugin list --status=active --field=name --allow-root | grep -qx stateflow
          wp eval 'var_dump(class_exists("StateFlow\Plugin"));' --allow-root | grep -q "bool(true)"
          wp eval '$c = wc_get_container()->get(Automattic\WooCommerce\Internal\Features\FeaturesController::class); $l = $c->get_compatible_plugins_for_feature("custom_order_tables", true); exit(in_array("stateflow/stateflow.php", $l["compatible"] ?? [], true) ? 0 : 1);' --allow-root
